# Builds and tests every push and pull request: compile (warnings fail it), unit tests, ITs, architecture rules.
# Nightly, and on demand, it also runs RealValidatorIT with the real HL7 validator. See docs/wiki/build-and-test.md.
name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"        # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer push cancels the older build of the same branch; the nightly run is not cancelled by a push
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # the validator version the docs were verified with (docs/validation.md); raise it deliberately
  VALIDATOR_VERSION: 7.0.2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp verify
      # the image is built and tried, not published (ADR-0015); --user, so that the results belong to the runner
      - name: Build the container image
        run: docker build -t testrunner:ci testrunner-app
      - name: Check the AT Core suite with the image
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" testrunner:ci \
            --config=config/dev-r4.yml --novalidator --check
      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: testrunner-app/target/site/jacoco-aggregate/
          retention-days: 14
      - name: Keep the software bill of materials
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: testrunner-app/target/bom.*
          retention-days: 14
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14

  real-validator:
    # needs the 200 MB validator and the FHIR packages from the internet: nightly and on demand only
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Cache the validator and the FHIR packages
        uses: actions/cache@v6
        with:
          path: |
            ~/validator
            ~/.fhir/packages
          key: validator-${{ env.VALIDATOR_VERSION }}
      - name: Download the validator
        run: |
          mkdir -p ~/validator
          test -f ~/validator/validator_cli.jar || curl -fsSL -o ~/validator/validator_cli.jar \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
      # RealValidatorIT runs three validator processes at once (parallelism 3). On an empty ~/.fhir/packages they all
      # install the same FHIR packages at the same moment, and the validator's package cache locking does not hold
      # across processes: the losers die after a few seconds with "NoSuchFileException: ...#4.0.1.lock ->
      # ...lock-deletion" and exit code 1, so their TestScripts end as ERROR ("produced no result"). The cache is only
      # saved when the job succeeds, so a failed run leaves it empty and the next run races again.
      # One validator run first fills the cache; the three processes then only read it. It uses the arguments of
      # the IT (-version 4.0, -tx n/a, -ig <suite>/Profiles), so it loads the same packages.
      - name: Fill the FHIR package cache with one validator run
        run: |
          java -jar ~/validator/validator_cli.jar \
            testdata/r4/Example_Instances/Patient-HL7ATCorePatientCreateTestExample.json \
            -version 4.0 -tx n/a -locale en -ig testdata/r4/Profiles -output "$RUNNER_TEMP/cache-warmup.json"
      - name: RealValidatorIT, both validator modes (the negative control must fail)
        run: |
          VALIDATOR_JAR="$HOME/validator/validator_cli.jar" mvn -B -ntp verify -pl testrunner-app -am \
            -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=RealValidatorIT -Dfailsafe.failIfNoSpecifiedTests=false
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-validator-reports
          path: testrunner-app/target/failsafe-reports/
          retention-days: 14
