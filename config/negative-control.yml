# The negative control: a Patient that violates AT Core cardinality. This run is EXPECTED TO FAIL;
# if it passes, profile validation is not running. See docs/validation.md.
testrunner:
  fhir-server:
    base-url: http://localhost:8080/fhir
  suites:
    - name: negative-control
      fhir-version: R4
      base-dir: testdata/r4
      include: ["TestScript-testscript-patient-create-negative-at-core.json"]
  validation:
    validator-jar: ${VALIDATOR_JAR:validator_cli.jar}
    mode: server               # the default; one process per validation with --testrunner.validation.mode=process
  reporting:
    output-dir: target/testrunner-results
