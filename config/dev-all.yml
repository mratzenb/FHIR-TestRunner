# Development configuration: every sample suite, FHIR version detected per TestScript, run in parallel.
# R4 and R5 TestScripts need a server of the matching version; give a suite its own server for that.
testrunner:
  fhir-server:
    base-url: http://localhost:8080/fhir
    headers:
      # Authorization: Bearer ${FHIR_TOKEN}
  suites:
    - name: samples
      base-dir: testdata/samples   # R4 and R5 mixed: the version is detected per TestScript
      # several samples create and update the same AT Core example patients: run them one after the other
      # (before the other suites), the AT Core suites run in parallel
      parallel: false
    - name: at-core-r4
      base-dir: testdata/r4
      # fhir-version: R4             # required with igs
      # igs: [ "hl7.at.fhir.core.r4#dev" ]  # IG package instead of / in addition to Profiles/, see docs/validation.md
    - name: at-core-r5
      base-dir: testdata/r5
      fhir-server:
        base-url: http://localhost:8081/fhir
  execution:
    parallelism: 4
  validation:
    validator-jar: ${VALIDATOR_JAR:validator_cli.jar}
    mode: server               # the default; one validator server per FHIR version, profiles folder and IGs (3 here)
    jvm-arguments: [-Xmx2g]
    server:
      startup-timeout: 5m
      fallback-to-process: true
    timeout: 3m
  reporting:
    output-dir: target/testrunner-results
    formats: [junit, summary, json, testreport]
    communication-log: true
    log-file-level: DEBUG
